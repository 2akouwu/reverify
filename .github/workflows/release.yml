name: release

# Tag vX.Y.Z -> build -> publish to PyPI via Trusted Publishing (no token anywhere).
# PyPI side: project settings -> Publishing -> GitHub: owner 2akouwu, repo reverify,
# workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag version=$ver"
          test "$tag" = "$ver"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Build provenance attestation (SLSA) for the sdist and wheel
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    # Skipped until the Trusted Publisher is registered on PyPI; then:
    #   gh variable set PYPI_TRUSTED_PUBLISHING --body true
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
