name: fuzz (nightly)

# The per-PR suite fuzzes a few hundred malformed inputs; this runs the same
# properties over tens of thousands every night: the parser never raises or
# leaks a warning, the verifier never raises, and a claim is never VERIFIED
# against bytes that do not match.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      REVERIFY_FUZZ_N: "20000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[full]"
      - name: Robustness and soundness fuzz (20k inputs)
        run: python -m unittest -v reverify.tests.test_differential.TestRobustnessFuzz
